[package]
name = "cujson-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Benchmark harness: cuJSON vs simd-json on Wikidata claims"
publish = false

[features]
cuda = ["cujson/cuda"]

[dependencies]
cujson = { workspace = true, features = ["cpu-reference"] }
clap.workspace = true
serde_json.workspace = true
simd-json = "0.17"
rayon = "1"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
arrow-array = "60.0.0"
