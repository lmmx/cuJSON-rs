# Upstream sources stay byte-identical to their import; fixtures are embedded verbatim.
exclude: ^(crates/cujson-sys/cuda/upstream/|tests/fixtures/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
